# --- GitHub Actions Workflow for Terraform Plan ---
# --- Flujo de trabajo de GitHub Actions para Terraform Plan ---
name: Terraform Plan
# --- This workflow is triggered on pull request events to the main branch, as well as manual execution from the GitHub interface. ---
# --- Este flujo de trabajo se activa en eventos de pull request a la rama principal, así como en la ejecución manual desde la interfaz de GitHub. ---
on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
# Permissions required for the workflow to assume an IAM role and access secrets.
# Permisos necesarios para que el flujo de trabajo pueda asumir un rol de IAM y acceder a los secretos.
permissions:
  id-token: write
  contents: read
  pull-requests: write
# --- Jobs for Terraform Plan ---
# --- Trabajos para Terraform Plan ---
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # --- Checkout the repository ---
      # --- Hacer checkout del repositorio ---
      - name: Checkout repository
        uses: actions/checkout@v4
      # --- Configure AWS Credentials ---
      # --- Configurar Credenciales de AWS ---
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-role
          aws-region: eu-west-1
      # --- Setup Terraform ---
      # --- Configurar Terraform ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      # --- Terraform Init and Plan ---
      # --- Inicialización y Plan de Terraform ---
      - name: Terraform Init (infra)
        run: terraform -chdir=infra init
      # --- Terraform Plan for infra ---
      # --- Plan de Terraform para infra ---
      - name: Terraform Plan (infra)
        id: plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
        run: terraform -chdir=infra plan -no-color -out=tfplan.binary
        continue-on-error: true
      # --- Post Plan to PR ---
      # --- Publicar Plan en PR ---
      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
      # --- Fail if Plan Failed ---
      # --- Fallar si el Plan Falló ---
      - name: Fail if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
